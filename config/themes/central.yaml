# Tema escuro do painel Central (tablet da sala). Aplicado so na view, via "theme: Central escuro".
Central escuro:
  primary-color: "#03a9f4"
  accent-color: "#ff9800"
  primary-background-color: "#111318"
  secondary-background-color: "#1c1c1f"
  lovelace-background: "#111318"
  card-background-color: "#1c1c1f"
  ha-card-background: "#1c1c1f"
  ha-card-border-color: "#2a2a2e"
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "none"
  primary-text-color: "#e8e8e8"
  secondary-text-color: "#9b9b9b"
  text-primary-color: "#ffffff"
  disabled-text-color: "#6f6f6f"
  disabled-color: "#6f6f6f"
  divider-color: "#2a2a2e"
  state-icon-color: "#9b9b9b"
  state-inactive-color: "#6f6f6f"
  app-header-background-color: "#111318"
  app-header-text-color: "#e8e8e8"
  sidebar-background-color: "#1c1c1f"
  sidebar-text-color: "#e8e8e8"
  sidebar-icon-color: "#9b9b9b"
  markdown-code-background-color: "#2a2a2e"
  input-fill-color: "#2a2a2e"
  mdc-theme-surface: "#1c1c1f"
  rgb-primary-text-color: "232, 232, 232"
  rgb-card-background-color: "28, 28, 31"
  weather-icon-cloud-front-color: "#d0d4da"
  weather-icon-cloud-back-color: "#8a9099"
  # view panel: espaco entre colunas e cards (o arredondamento vai em cada card via card_mod)
  stack-card-gap: "10px"
