# Itens do CoreScope: ficam DENTRO do bloco rest: (junto com configuration-rest.yaml). Gerado por scripts/corescope_rest.py.
  # CoreScope da comunidade (corescope.example.org), so leitura (gerado por corescope_rest.py)
  - resource: https://corescope.example.org/api/nodes/438702360c1a1ef1d268c787a0d19550657478bcc2c48ff9efffca515d168ea6
    scan_interval: 3600
    headers:
      User-Agent: ha-casa/1.0
    sensor:
      - name: CoreScope REP-CASA-4387
        unique_id: corescope_meu_repetidor
        icon: mdi:radio-tower
        unit_of_measurement: "pacotes"
        state_class: measurement
        value_template: "{{ value_json.node.relay_count_24h | int(0) }}"
        json_attributes_path: "$.node"
        json_attributes:
          - name
          - first_seen
          - last_heard
          - last_relayed
          - relay_count_1h
          - relay_active
          - usefulness_grade
          - usefulness_score
          - coverage_score
          - bridge_score
          - redundancy_score
          - traffic_share_score
          - advert_count
          - flood_advert_count_7d
          - battery_mv
          - temperature_c
  - resource: https://corescope.example.org/api/nodes/438702360c1a1ef1d268c787a0d19550657478bcc2c48ff9efffca515d168ea6/analytics?days=7
    scan_interval: 10800
    headers:
      User-Agent: ha-casa/1.0
    sensor:
      - name: CoreScope meu_repetidor disponibilidade
        unique_id: corescope_meu_repetidor_disponibilidade
        icon: mdi:percent-circle
        unit_of_measurement: "%"
        state_class: measurement
        value_template: "{{ value_json.computedStats.availabilityPct }}"
        json_attributes_path: "$.computedStats"
        json_attributes:
          - signalGrade
          - snrMean
          - snrStdDev
          - totalPackets
          - uniqueObservers
          - avgPacketsPerDay
          - longestSilenceMs
          - longestSilenceStart
          - relayPct
      - name: CoreScope meu_repetidor relogio
        unique_id: corescope_meu_repetidor_relogio
        icon: mdi:clock-alert-outline
        unit_of_measurement: "min"
        value_template: "{{ ((value_json.clockSkew.lastSkewSec | float(0)) / 60) | round(0) | int }}"
        json_attributes_path: "$.clockSkew"
        json_attributes:
          - severity
          - driftPerDaySec
          - medianSkewSec
  - resource: https://corescope.example.org/api/nodes/438702360c1a1ef1d268c787a0d19550657478bcc2c48ff9efffca515d168ea6/neighbors
    scan_interval: 3600
    headers:
      User-Agent: ha-casa/1.0
    sensor:
      - name: CoreScope meu_repetidor vizinhos
        unique_id: corescope_meu_repetidor_vizinhos
        icon: mdi:account-group
        unit_of_measurement: "vizinhos"
        state_class: measurement
        value_template: "{{ value_json.neighbors | length }}"
        json_attributes:
          - neighbors
      - name: CoreScope meu_repetidor melhor vizinho
        unique_id: corescope_meu_repetidor_melhor_vizinho
        icon: mdi:star-circle
        value_template: "{% set l = value_json.neighbors | sort(attribute='count', reverse=true) | list %}{{ (l[0].name ~ ' (' ~ (l[0].distance_km | default(0) | round(1)) ~ ' km)')[:250] if l else '-' }}"
  - resource: https://corescope.example.org/api/nodes/438702360c1a1ef1d268c787a0d19550657478bcc2c48ff9efffca515d168ea6/health
    scan_interval: 3600
    headers:
      User-Agent: ha-casa/1.0
    sensor:
      - name: CoreScope meu_repetidor observers
        unique_id: corescope_meu_repetidor_observers
        icon: mdi:ear-hearing
        unit_of_measurement: "observers"
        state_class: measurement
        value_template: "{{ value_json.observers | length }}"
        json_attributes:
          - observers
          - stats
