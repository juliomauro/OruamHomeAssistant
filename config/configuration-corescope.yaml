    headers:
      User-Agent: ha-casa/1.0
    sensor:
      - name: CoreScope canal Public
        unique_id: corescope_public
        icon: mdi:forum
        value_template: "{{ (value_json.messages | last).packetHash if value_json.messages else '-' }}"
        json_attributes:
          - messages
          - total
  - resource: https://corescope.example.org/api/observers
    scan_interval: 600
    headers:
      User-Agent: ha-casa/1.0
    sensor:
      - name: CoreScope meu observer
        unique_id: corescope_meu_observer
        icon: mdi:antenna
        unit_of_measurement: "pacotes/h"
        state_class: measurement
        value_template: "{% set o = value_json.observers | selectattr('id', 'eq', '43879F79CD8738BB68F9C85809B821247D00D3419308D636E651B6E203726AAA') | list %}{{ o[0].packetsLastHour if o and o[0].packetsLastHour not in [None, 'None'] else 0 }}"
      - name: CoreScope meu observer ultimo pacote
        unique_id: corescope_meu_observer_ultimo_pacote
        icon: mdi:package-up
        value_template: "{% set o = value_json.observers | selectattr('id', 'eq', '43879F79CD8738BB68F9C85809B821247D00D3419308D636E651B6E203726AAA') | list %}{{ o[0].last_packet_at if o and o[0].last_packet_at not in [None, 'None'] else none }}"
      - name: CoreScope meu observer visto
        unique_id: corescope_meu_observer_visto
        icon: mdi:wifi-check
        value_template: "{% set o = value_json.observers | selectattr('id', 'eq', '43879F79CD8738BB68F9C85809B821247D00D3419308D636E651B6E203726AAA') | list %}{{ o[0].last_seen if o and o[0].last_seen not in [None, 'None'] else none }}"
      - name: CoreScope meu observer total
        unique_id: corescope_meu_observer_total
        icon: mdi:counter
        unit_of_measurement: "pacotes"
        value_template: "{% set o = value_json.observers | selectattr('id', 'eq', '43879F79CD8738BB68F9C85809B821247D00D3419308D636E651B6E203726AAA') | list %}{{ o[0].packet_count if o and o[0].packet_count not in [None, 'None'] else 0 }}"
      - name: CoreScope meu observer firmware
        unique_id: corescope_meu_observer_firmware
        icon: mdi:chip
        value_template: "{% set o = value_json.observers | selectattr('id', 'eq', '43879F79CD8738BB68F9C85809B821247D00D3419308D636E651B6E203726AAA') | list %}{{ o[0].firmware if o and o[0].firmware not in [None, 'None'] else '-' }}"

