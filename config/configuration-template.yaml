# Sensores de template (bloco template: do configuration.yaml). O ultimo item guarda as ultimas 15 mensagens do MeshCore.
template:
  # BLOCO chuva
  # Chuva nas proximas 2 horas (previsao horaria do weather.casa, a cada 20 min)
  - trigger:
      - trigger: time_pattern
        minutes: "/20"
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target: {entity_id: weather.casa}
        data: {type: hourly}
        response_variable: prev
    binary_sensor:
      - name: Chuva chegando
        unique_id: chuva_chegando
        icon: mdi:weather-pouring
        state: >-
          {% set f = prev['weather.casa'].forecast[:3] %}
          {{ (f | selectattr('precipitation', 'ge', 0.5) | list | count > 0)
             or (f | selectattr('condition', 'in', ['pouring', 'lightning-rainy']) | list | count > 0) }}
        attributes:
          inicio: >-
            {% set f = prev['weather.casa'].forecast[:3] | selectattr('precipitation', 'ge', 0.5) | list %}
            {{ as_local(as_datetime(f[0].datetime)).strftime('%H:%M') if f else '' }}
          mm_3h: "{{ prev['weather.casa'].forecast[:3] | sum(attribute='precipitation') | round(1) }}"
  # FIM chuva
  # BLOCO noite
  # Diario da noite (22h-8h) para o bom dia no Telegram; zera as 08:05
  - trigger:
      - trigger: state
        entity_id: binary_sensor.entrada_porta_de_entrada_porta
        from: "off"
        to: "on"
        id: porta
      - trigger: state
        entity_id: binary_sensor.rede_cloudflare
        from: "on"
        to: "off"
        for: {minutes: 2}
        id: net_off
      - trigger: state
        entity_id: binary_sensor.rede_cloudflare
        from: "off"
        to: "on"
        id: net_on
      - trigger: state
        entity_id: [binary_sensor.deco_sala_online, binary_sensor.deco_office_online]
        from: "on"
        to: "off"
        for: {minutes: 3}
        id: deco
      - trigger: event
        event_type: entity_registry_updated
        event_data: {action: create}
        id: wifi
      - trigger: time
        at: "08:05:00"
        id: reset
    sensor:
      - name: Diario da noite
        unique_id: diario_noite
        icon: mdi:weather-night
        state: "{{ (this.attributes.eventos | default([]) | count) if trigger.id != 'reset' else 0 }}"
        attributes:
          eventos: >-
            {% set l = this.attributes.eventos | default([]) %}
            {% set h = now().strftime('%H:%M') %}
            {% set noite = now().hour >= 22 or now().hour < 8 %}
            {% set t = trigger.id %}
            {% if t == 'reset' %}{{ [] }}
            {% elif not noite %}{{ l }}
            {% elif t == 'porta' %}{{ (l + [h ~ ' porta de entrada aberta'])[-20:] }}
            {% elif t == 'net_off' %}{{ (l + [as_local(trigger.from_state.last_changed).strftime('%H:%M') ~ ' internet caiu'])[-20:] }}
            {% elif t == 'net_on' %}{{ (l + [h ~ ' internet voltou'])[-20:] }}
            {% elif t == 'deco' %}{{ (l + [h ~ ' ' ~ trigger.to_state.name ~ ' offline'])[-20:] }}
            {% elif t == 'wifi' and trigger.event.data.entity_id is match('device_tracker\.(sala|office)_deco_') %}{{ (l + [h ~ ' aparelho novo no Wi-Fi: ' ~ (trigger.event.data.entity_id.split('.')[1] | regex_replace('^(sala|office)_deco_', ''))])[-20:] }}
            {% else %}{{ l }}{% endif %}
  # FIM noite
  # Agenda: eventos de hoje e amanha para o painel do tablet
  - trigger:
      - trigger: time_pattern
        minutes: "/10"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: agenda_atualizar
    action:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.pessoal
            - calendar.familia
            - calendar.birthdays
            - calendar.feriados_no_brasil
            - calendar.f1
            - calendar.escola
        data:
          start_date_time: "{{ today_at() }}"
          end_date_time: "{{ today_at() + timedelta(days=2) }}"
        response_variable: agenda
    sensor:
      - name: Agenda hoje
        unique_id: agenda_hoje
        icon: mdi:calendar-today
        state: >-
          {% set ini = as_timestamp(today_at()) %}{% set fim = ini + 86400 %}
          {% set ns = namespace(n=0) %}
          {% for cal, v in agenda.items() %}{% for e in v.events %}
          {% if as_timestamp(e.start, 0) < fim and as_timestamp(e.end, 0) > ini %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}{% endfor %}
          {{ ns.n }}
        attributes:
          eventos: >-
            {% set ns = namespace(l=[]) %}
            {% for cal, v in agenda.items() %}{% for e in v.events %}
            {% set ns.l = ns.l + [{'ts': as_timestamp(e.start, 0) | int, 'te': as_timestamp(e.end, 0) | int, 'dia_todo': e.start | length == 10,
               'titulo': e.summary, 'agenda': state_attr(cal, 'friendly_name')}] %}
            {% endfor %}{% endfor %}
            {{ ns.l | sort(attribute='ts') }}
  - trigger:
      - trigger: event
        event_type: meshcore_message
    sensor:
      - name: Mesh ultima mensagem
        unique_id: mesh_ultima_mensagem
        icon: mdi:message-text
        state: "{{ ((trigger.event.data.sender_name or '?') ~ ': ' ~ (trigger.event.data.message or ''))[:250] }}"
        attributes:
          mensagens: >-
            {% set d = trigger.event.data %}
            {% set nova = {'hora': now().strftime('%d/%m %H:%M'), 'de': d.sender_name or '?',
               'canal': d.channel if d.message_type == 'channel' else 'Direta',
               'msg': (d.message or '')[:200], 'saida': d.outgoing | default(false),
               'hops': d.hop_count | default('')} %}
            {{ ([nova] + (this.attributes.mensagens | default([])))[:15] }}
